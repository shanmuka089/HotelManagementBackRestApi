version: "3"
services:
  application:
    image: shanmukha089/hotel-management-application-rest-api
    ports:
      - "8080:8080"
    networks:
      - springboot-db-net
    depends_on:
      - mysqldb
    volumes:
      - /data/springboot-app
  mysqldb:
    image: mysql:8.0
    networks:
      - springboot-db-net
    ports:
     - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=Shanmukha@5525
      - MYSQL_DATABASE=myDb
    volumes:
      - /data/mysql
networks:
  springboot-db-net: